name: Local Platform

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/local-config.yml"
      - "versions.env"
      - "Makefile"
      - "platform/**"
      - "scripts/check-local-config.sh"
      - "scripts/check-version-inventory.sh"
      - "scripts/local-*.sh"
      - "tests/e2e/**"
      - "tests/infrastructure/**"

permissions:
  contents: read

jobs:
  check:
    name: render-and-validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Validate local baseline configuration
        run: make check-local-config

  runtime:
    name: fresh-cluster-runtime
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"
          echo "kubectl=$KUBECTL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Setup kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ steps.versions.outputs.kubectl }}

      - name: Install pinned k3d
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          curl -fsSLo /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_LINUX_AMD64_SHA256  /tmp/k3d" | sha256sum --check -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version | grep -F "k3d version $K3D_VERSION"

      - name: Verify fresh local runtime
        run: make local-verify


  gitops:
    name: argocd-core-reconciliation
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"
          echo "kubectl=$KUBECTL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Setup kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ steps.versions.outputs.kubectl }}

      - name: Install pinned k3d
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          curl -fsSLo /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_LINUX_AMD64_SHA256  /tmp/k3d" | sha256sum --check -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version | grep -F "k3d version $K3D_VERSION"

      - name: Verify Argo CD Core reconciliation
        env:
          GITOPS_TARGET_REVISION: ${{ github.event.pull_request.head.sha }}
        run: make local-gitops-verify
