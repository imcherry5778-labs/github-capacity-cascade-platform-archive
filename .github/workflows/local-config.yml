name: Local Config

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/local-config.yml"
      - "versions.env"
      - "Makefile"
      - "platform/**"
      - "scripts/check-local-config.sh"

permissions:
  contents: read

jobs:
  check:
    name: render-and-validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "helm=$HELM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Validate local baseline configuration
        run: make check-local-config
