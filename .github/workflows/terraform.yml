name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/terraform.yml"
      - "versions.env"
      - "infra/terraform/**"
      - "scripts/check-version-inventory.sh"

permissions:
  contents: read

jobs:
  validate:
    name: bootstrap-fmt-validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Terraform version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "terraform=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Check version inventory
        run: make check-versions

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false -lockfile=readonly

      - name: Validate bootstrap
        run: terraform -chdir=infra/terraform/bootstrap validate
